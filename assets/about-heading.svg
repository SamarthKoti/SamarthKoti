<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" role="img" aria-label="About Me">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#188CFF" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#188CFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="45" y1="55" x2="335" y2="55" stroke="url(#line)" stroke-width="1.5"/>
  <line x1="665" y1="55" x2="955" y2="55" stroke="url(#line)" stroke-width="1.5"/>

  <text x="500" y="68" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="36" font-weight="700" letter-spacing="5"
        fill="#F0F6FC">ABOUT ME</text>

  <text x="370" y="66" text-anchor="middle"
        font-family="Consolas, 'Courier New', monospace"
        font-size="28" font-weight="700"
        fill="#188CFF" filter="url(#glow)">&lt;/&gt;</text>
</svg>
